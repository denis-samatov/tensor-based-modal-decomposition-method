name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Check syntax and compilation
      run: |
        python -m compileall src tests examples

    - name: Lint with Ruff
      run: |
        python -m ruff check src tests examples

    - name: Run test suite
      run: |
        pytest

    # Modules with known type debt are explicitly listed in pyproject.toml.
    # All other core modules are enforced as a blocking merge gate.
    - name: Type check core with mypy
      if: matrix.python-version == '3.12'
      run: |
        python -m mypy src/TBMD/core
