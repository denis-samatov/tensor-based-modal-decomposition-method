name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  statistics-only-replay:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up isolated statistics Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: studies/brugge_sparse_sensing/requirements-statistics.txt
    - name: Install only hash-locked statistics dependencies
      run: python -m pip install --require-hashes -r studies/brugge_sparse_sensing/requirements-statistics.txt
    - name: Replay twelve core artifacts from stored rows
      run: python studies/brugge_sparse_sensing/scripts/verify_statistics.py --output-dir "$RUNNER_TEMP/tbmd-statistics-replay"
    - name: Retain bounded replay receipt and logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: statistics-only-replay
        path: |
          ${{ runner.temp }}/tbmd-statistics-replay/receipt.json
          ${{ runner.temp }}/tbmd-statistics-replay/logs/
        if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Check syntax and compilation
      run: |
        python -m compileall src tests examples

    - name: Lint with Ruff
      run: |
        python -m ruff check src tests examples

    - name: Run test suite
      run: |
        pytest

    # Modules with known type debt are explicitly listed in pyproject.toml.
    # All other core modules are enforced as a blocking merge gate.
    - name: Type check core with mypy
      if: matrix.python-version == '3.12'
      run: |
        python -m mypy src/TBMD/core

    - name: Build wheel and verify installation outside checkout
      run: |
        python -m pip install build
        python -m build --wheel
        python -m venv --system-site-packages /tmp/tbmd-wheel-smoke
        /tmp/tbmd-wheel-smoke/bin/python -m pip install --ignore-installed --no-deps dist/*.whl
        cp examples/basic/04_complete_pipeline.py /tmp/tbmd-complete-pipeline.py
        cd /tmp
        /tmp/tbmd-wheel-smoke/bin/python -c "import TBMD, sys; from pathlib import Path; print(TBMD.__file__); assert Path(TBMD.__file__).is_relative_to(Path(sys.prefix)); from TBMD.core.decomposition.hosvd import TuckerDecomposer; import torch; model = TuckerDecomposer(torch.zeros(2, 2, 2), ranks=[1, 1, 1]); model.decompose(); model.reconstruct(); assert model.reconstruction_errors == 0.0"
        MPLBACKEND=Agg OMP_NUM_THREADS=1 /tmp/tbmd-wheel-smoke/bin/python /tmp/tbmd-complete-pipeline.py --solver least_squares --spatial-points 20 --time-steps 12 --n-modes 4 --n-sensors 3
