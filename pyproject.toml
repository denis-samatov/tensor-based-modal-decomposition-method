[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbmd"
version = "2.0.0"
description = "Tensor-Based Modal Decomposition Method for reduced-order modeling, sensor placement, and field reconstruction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Denis Samatov"},
]
keywords = ["tensor", "modal-decomposition", "ROM", "sensor-placement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "hdbscan>=0.8.39",
    "tensorly>=0.9",
    "pandas>=2.2",
    "h5py>=3.12",
    "pillow>=11.0",
    "scikit-image>=0.23",
    "tqdm>=4.66",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "ipython>=8.30",
    "jupyter_client>=8.6",
    "jupyter_core>=5.7",
    "nbformat>=5.10",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

# Explicit type-debt baseline. Remove modules from this list as their annotations are repaired;
# every other module under src/TBMD/core is enforced by the blocking CI type-check job.
[[tool.mypy.overrides]]
module = [
    "TBMD.core.data.export",
    "TBMD.core.data.loaders",
    "TBMD.core.data.processors",
    "TBMD.core.decomposition.geometry_aware",
    "TBMD.core.decomposition.hosvd",
    "TBMD.core.geometry.graph",
    "TBMD.core.modal_processor.modes",
    "TBMD.core.reconstruction.geometry_aware",
    "TBMD.core.reconstruction.tensor_compressive_sensing",
    "TBMD.core.sensor_placement.geometry_aware",
    "TBMD.core.sensor_placement.tensor_qr_factorization",
    "TBMD.core.utils.misc",
]
ignore_errors = true

# NumPy releases installed on newer CI interpreters can publish stubs that use
# syntax newer than this project's minimum supported Python version. Treat NumPy
# as an external boundary so those stubs do not prevent checking TBMD itself.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[project.urls]
Homepage = "https://github.com/denis-samatov/tensor_based_modal_decomposition_method"
Documentation = "https://github.com/denis-samatov/tensor_based_modal_decomposition_method/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741", "E501"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "results",
]
